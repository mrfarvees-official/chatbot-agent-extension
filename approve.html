<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site Agent · Approval</title>
    <link rel="icon" href="icons/icon-32.png" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body class="approval-page">
    <main class="approval-card" aria-labelledby="title">
      <header class="approval-heading">
        <span class="brand-icon" aria-hidden="true">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6l-8-3Z" /><path d="m8 12 3 3 5-6" />
          </svg>
        </span>
        <div><p class="eyebrow">Site Agent</p><h1 id="title">Review this action</h1></div>
      </header>
      <p id="description" class="description">Review the details before approving.</p>
      <pre id="detail" class="approval-detail" tabindex="0" aria-label="Action details"></pre>
      <p id="error" class="error" role="alert"></p>
      <div class="approval-actions">
        <button id="no" type="button">Deny</button>
        <button id="ok" type="button" class="primary">Approve</button>
      </div>
      <p class="approval-note">Closing this window declines the request.</p>
    </main>
    <script src="approve.js"></script>
  </body>
</html>
