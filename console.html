<!doctype html>
<meta charset="utf-8" />
<title>Agent console</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="icons/icon-32.png" />
<link rel="stylesheet" href="theme.css" />
<body class="console-page">
  <h2>Agent console</h2>
  <label
    ><input type="checkbox" id="paused" /> Pause all tool calls (kill
    switch)</label
  >
  <h3>Tools</h3>
  <div id="tools"></div>
  <h3>Granted sites</h3>
  <div id="perms"></div>
  <h3>Connected sites</h3>
  <div id="connectedSites"></div>
  <h3>Activity (last 50)</h3>
  <pre id="log"></pre>
  <script src="console.js"></script>
</body>
