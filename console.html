<!doctype html>
<meta charset="utf-8" />
<title>Agent console</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 860px;
    margin: 24px auto;
    padding: 0 16px;
  }
  .card {
    border: 1px solid #8884;
    border-radius: 8px;
    padding: 12px;
    margin: 10px 0;
  }
  .badge {
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 6px;
    border: 1px solid #8886;
    margin-left: 6px;
  }
  label {
    display: block;
    margin: 6px 0;
  }
  input[type="text"],
  input[type="number"],
  textarea,
  select {
    width: 100%;
    box-sizing: border-box;
  }
  pre {
    white-space: pre-wrap;
    word-break: break-word;
    background: #8881;
    padding: 8px;
    border-radius: 6px;
  }
</style>
<body>
  <h2>Agent console</h2>
  <label
    ><input type="checkbox" id="paused" /> Pause all tool calls (kill
    switch)</label
  >
  <h3>Tools</h3>
  <div id="tools"></div>
  <h3>Granted sites</h3>
  <div id="perms"></div>
  <h3>Connected sites</h3>
  <div id="connectedSites"></div>
  <h3>Activity (last 50)</h3>
  <pre id="log"></pre>
  <script src="console.js"></script>
</body>
